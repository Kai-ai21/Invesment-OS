<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The pre-mount title. Every route replaces it once React runs; see
         hooks/useDocumentTitle. -->
    <title>Kailaas OS</title>
    <meta
      name="description"
      content="Kailaas OS remembers why you invested and checks whether it still holds. Write a thesis as testable claims, then have filings read against them."
    />

    <!-- ⚠️ THE TWO LANDING-HERO FACES, AND ONLY THOSE TWO.
         Righteous is the "Kailaas OS" wordmark, Fraunces the line under it. They
         are the first text painted on a cold visit, and without these links they
         were the LAST things fetched: a font is not requested until some text
         needs it, and the hero is client-rendered, so the request waited behind
         the CSS, the bundle, React's first render and layout — the hero painted
         in the fallback and swapped once the real face landed. Preloading starts
         both downloads while the HTML is still being parsed instead.

         `crossorigin` is REQUIRED even though these are same-origin: fonts are
         fetched in CORS mode, and a preload without it is cached under a
         different key, so the CSS request misses it and downloads the file a
         second time. The href must byte-match the url() in index.css for the
         same reason — that is also why these paths are hand-written under
         /public/fonts rather than resolved by Vite, which would hash them.

         Do NOT add the body face (Geist) or Newsreader here. Preload is a
         queue-jumping request the browser cannot defer; spending it on
         below-the-fold faces delays the two that are actually on screen. -->
    <link
      rel="preload"
      href="/fonts/righteous-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ⚠️ THE SIMPLIFIED MARK, NOT /logo.svg, AND THE DIFFERENCE IS DELIBERATE.
         logo.svg carries a DOTTED tail off the summit; measured at a real 16x16
         rasterisation those dashes are sub-pixel and land as a scatter of grey —
         they read as dirt on the glyph rather than as a tail. logo-icon.svg is the
         same ridge with a solid thin tail, which survives.

         It also carries its own dark tile, for two reasons logo.svg cannot solve:
         a favicon is a separate document, so `currentColor` has no page to inherit
         from, and a fixed light stroke on transparent would vanish against a light
         browser tab. The tile makes it legible on any chrome. -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />

    <!-- iOS ignores SVG here and applies its own rounded mask, so this is a PNG and
         is FULL BLEED — a pre-rounded source would show as corners inside corners.
         180x180 is the size current iPhones ask for. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Matches --background (#0f1115). Without it, mobile Chrome paints its
         address bar the default light grey above a near-black page, which reads
         as a rendering fault rather than a theme. -->
    <meta name="theme-color" content="#0f1115" />
    <!-- Tells the browser the page is dark, so native form controls, scrollbars
         and the flash before first paint follow the theme rather than fight it.
         Dark is the only theme the app has — see the palette note in index.css. -->
    <meta name="color-scheme" content="dark" />

    <!-- Link previews. These are the app-level fallback: the app is
         client-rendered, so a crawler following a deep link sees these rather
         than the route's own title. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kailaas OS" />
    <meta property="og:title" content="Kailaas OS" />
    <meta
      property="og:description"
      content="Remembers why you invested. Checks if it still holds."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
